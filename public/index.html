<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weather, Relatively</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Weather, Relatively</h1>
  <p class="tagline">Not just what the weather is — what it means, compared to somewhere else.</p>
</header>

<main>
  <form id="compare-form">
    <div class="location-card">
      <h2>From</h2>
      <label>Location
        <input type="text" id="location-a" placeholder="e.g. London" autocomplete="off" required />
      </label>
      <label>Date
        <input type="date" id="date-a" required />
      </label>
    </div>

    <button type="button" id="swap-btn" title="Swap" aria-label="Swap locations">⇄</button>

    <div class="location-card">
      <h2>To</h2>
      <label>Location
        <input type="text" id="location-b" placeholder="e.g. Reykjavik" autocomplete="off" required />
      </label>
      <label>Date
        <input type="date" id="date-b" required />
      </label>
    </div>
  </form>

  <button id="compare-btn" type="submit" form="compare-form">Compare weather</button>

  <p id="error-message" class="error" hidden></p>

  <section id="results" hidden>
    <div class="ai-take">
      <h2>The take</h2>
      <p id="ai-text"></p>
    </div>

    <div class="table-wrap">
      <table id="stats-table">
        <thead>
          <tr>
            <th></th>
            <th id="col-a-label"></th>
            <th id="col-b-label"></th>
            <th>Difference</th>
          </tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <p>Weather data from <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>. Comparisons generated by Claude.</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
